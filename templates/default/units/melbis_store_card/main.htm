<div class="card h-100 melbis_css_card">
    <a href="{ID|$StoreLink}">{MELBIS:melbis_store_image([ID],kCataloge)}</a>
    <div class="card-body">
        <h5 class="card-title"><a href="{ID|$StoreLink}" class="text-dark">{NAME|html}</a></h5>
        <p class="card-text small text-muted">{INTRO|short|text}</p>
    </div>
    {MELBIS:melbis_store_features([ID],kTopic)}
    <div class="card-body flex-grow-0 d-flex flex-wrap justify-content-between align-items-center">
        <div>
            <div class="h5 font-weight-bold mb-1">{PRICE_CURR|inum}</div>
            <span class="badge badge-warning">{STATUS_KEY|$StatusName|html}</span>
        </div>
        <button class="btn btn-primary text-nowrap ml-auto melbis_btn_add" data-id="{ID}" data-name="{NAME|html}"><i class="fa fa-cart-plus"></i> Buy</button>
    </div>
</div>
